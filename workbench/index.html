<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>宇宙边角办事处</title>

  <!-- PWA 配置 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1A0F3D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="边角办事处">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iOS 图标 -->
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- 样式表（?v=5 强制刷新缓存） -->
  <link rel="stylesheet" href="css/style.css?v=5">
  <link rel="stylesheet" href="css/daily.css?v=5">
  <link rel="stylesheet" href="css/english.css?v=5">
  <link rel="stylesheet" href="css/pets.css?v=5">
  <link rel="stylesheet" href="css/modules.css?v=5">
</head>
<body>
  <!-- 移动端侧边栏遮罩层 -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div id="app">
    <!-- 移动端顶部头部栏（仅手机竖屏显示，汉堡按钮+板块标题，不悬浮遮挡内容） -->
    <header class="mobile-header" id="mobileHeader">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="打开导航菜单">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <span class="mobile-header-title" id="mobileHeaderTitle">宇宙边角办事处</span>
    </header>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <span class="logo-icon">🏠</span>
          <span class="logo-text" id="logoText">宇宙边角办事处</span>
        </div>
        <button class="sidebar-toggle" id="sidebarToggle" title="收起/展开">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-footer-btns">
          <button class="sidebar-sync-btn" id="sidebarSyncBtn" title="一键同步数据">
            <span class="sync-icon">☁️</span>
            <span class="sync-btn-text">同步</span>
          </button>
          <button class="sidebar-data-btn" id="sidebarDataBtn" title="数据管理">
            <span>⚙️</span>
            <span class="data-btn-text">数据管理</span>
          </button>
        </div>
        <span class="footer-date" id="footerDate"></span>
      </div>
    </aside>

    <main class="main-content" id="mainContent">
      <div class="sub-tabs-bar" id="subTabsBar"></div>
      <div class="content-container" id="contentContainer"></div>
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay"></div>

  <!-- 脚本（顺序：存储 → 同步 → 数据 → 应用逻辑，?v=5 强制刷新缓存） -->
  <script src="js/storage.js?v=5"></script>
  <script src="js/sync.js?v=5"></script>
  <script src="js/data_manager.js?v=5"></script>
  <script src="js/data.js?v=5"></script>
  <script src="js/cet4_extra.js?v=5"></script>
  <script src="js/daily.js?v=5"></script>
  <script src="js/english.js?v=5"></script>
  <script src="js/pets.js?v=5"></script>
  <script src="js/inspiration.js?v=5"></script>
  <script src="js/viral.js?v=5"></script>
  <script src="js/recipe.js?v=5"></script>
  <script src="js/news.js?v=5"></script>
  <script src="js/finance.js?v=5"></script>
  <script src="js/fund.js?v=5"></script>
  <script src="js/auto_update.js?v=5"></script>
  <script src="js/app.js?v=5"></script>

  <!-- PWA Service Worker 注册（自动检测更新并刷新） -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js?v=5')
          .then(reg => {
            console.log('[SW] 注册成功:', reg.scope);
            // 检测到新 SW 激活后自动刷新页面
            if (reg.waiting) {
              reg.waiting.postMessage('SKIP_WAITING');
            }
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'activated') {
                    window.location.reload();
                  }
                });
              }
            });
          })
          .catch(err => console.warn('[SW] 注册失败:', err));

        // 监听控制器变化（新 SW 已接管）
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          window.location.reload();
        });
      });
    }
  </script>
</body>
</html>
